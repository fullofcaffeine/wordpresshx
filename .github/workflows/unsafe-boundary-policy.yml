name: Unsafe-boundary policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsafe-boundary-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate unsafe-boundary waivers, inventories, and release stops
        run: python3 scripts/security/test-unsafe-boundary-policy.py
