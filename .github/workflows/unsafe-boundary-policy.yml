name: Unsafe-boundary policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsafe-boundary-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install exact project Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.17.0
          package-manager-cache: false
      - name: Install pinned independent JSON Schema validator
        run: npm --prefix scripts/security/unsafe-boundary-schema ci --ignore-scripts --no-audit --no-fund
      - name: Validate closed schemas with independent Draft 2020-12 semantics
        run: npm --prefix scripts/security/unsafe-boundary-schema test
      - name: Build pinned Beads compatibility reader
        id: beads
        run: |
          binary="$(bash scripts/beads/build-history-reader.sh)"
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"
      - name: Fetch the public Beads Dolt authority ref
        run: |
          git ls-remote origin refs/dolt/data
          git fetch --no-tags origin refs/dolt/data:refs/dolt/data
      - name: Validate waivers, lifecycle authority, live removal Bead, and release stops
        env:
          WORDPRESSHX_BD_BIN: ${{ steps.beads.outputs.binary }}
          WORDPRESSHX_BEADS_REMOTE: git+https://github.com/fullofcaffeine/wordpresshx.git
        run: python3 scripts/security/test-unsafe-boundary-policy.py --verify-beads
